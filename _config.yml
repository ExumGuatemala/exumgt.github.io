title: Exum
url: "https://www.exumsoftware.com"
baseurl: ""

markdown: kramdown
plugins:
  - jekyll-sitemap

exclude:
  - docs
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md

# Keep the old /igroom.html redirect stub (noindex) out of sitemap.xml
defaults:
  - scope:
      path: "igroom.html"
    values:
      sitemap: false

